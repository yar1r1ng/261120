<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>향로 발굴 기록 · 16bit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&display=swap">
<style>
:root{--gold:#f2c14e;--gold2:#c8902a;--navy:#0b1030;--ink:#05071a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:#ffe9b0;font-family:'Do Hyeon',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;align-items:center;padding-top:4px}
#hud{display:flex;justify-content:space-between;align-items:center;height:32px;font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gold);gap:6px}
#hud button{font-family:inherit;font-size:9px;background:none;border:2px solid var(--gold2);color:var(--gold);padding:4px 6px;cursor:pointer}
#stage{position:relative;border:3px solid var(--gold2);box-shadow:0 0 0 3px #000,0 0 24px #f2c14e33;background:#000;flex:none}
#c{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:crosshair}
#overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#panel{height:150px;padding-top:8px;flex:none}
.box{background:var(--navy);border:3px solid var(--gold);box-shadow:inset 0 0 0 2px #000,0 0 0 2px #000;padding:7px 10px}
#dlg{min-height:56px;font-size:15px;line-height:1.35}
#codex{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:7px}
.slot{aspect-ratio:1;background:#0f1540;border:2px solid #343a78;display:flex;align-items:center;justify-content:center;position:relative;font-family:'Press Start 2P',monospace;color:#343a78;font-size:12px;overflow:hidden}
.slot.on{border-color:var(--gold);box-shadow:0 0 8px #f2c14e66}
.slot canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.slot span{position:absolute;bottom:0;left:0;right:0;text-align:center;font-family:'Do Hyeon',sans-serif;font-size:11px;color:var(--gold);background:#0b1030dd;line-height:1.3}
.prog{height:10px;background:#000;border:2px solid var(--gold2);margin-top:8px}
.prog i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,#ffe08a 6px 8px);width:0}
.btn{pointer-events:auto;font-family:'Press Start 2P',monospace;font-size:10px;color:#1a1000;background:var(--gold);border:none;padding:10px 14px;box-shadow:0 4px 0 var(--gold2),0 4px 0 2px #000;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold2)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.dim{background:#000a}
.banner{font-family:'Press Start 2P',monospace;color:var(--gold);text-shadow:3px 3px 0 #000,0 0 14px #f2c14e88;line-height:1.4}
.sub{font-size:15px;color:#fff3cf;text-shadow:2px 2px 0 #000}
.card{pointer-events:auto;width:88%;background:var(--navy);border:3px solid var(--gold);box-shadow:0 0 0 3px #000,0 0 30px #f2c14e55;padding:10px;text-align:left}
.card h3{margin:2px 0 8px;font-weight:400;font-size:22px;color:var(--gold)}
.card h3 small{font-family:'Press Start 2P',monospace;font-size:8px;color:#9aa0e0;margin-left:6px}
.card canvas{width:100px;height:100px;image-rendering:pixelated;border:2px solid var(--gold2);background:#000;float:left;margin:0 10px 6px 0}
.card p{margin:0 0 6px;font-size:14px;line-height:1.4}
.card .how{color:#9ee6cf;font-size:13px}
.tag{font-family:'Press Start 2P',monospace;font-size:8px;color:#9aa0e0}
.label{position:absolute;font-size:13px;color:var(--gold);white-space:nowrap;transform:translateY(-50%);text-shadow:1px 1px 0 #000;opacity:0;transition:opacity .3s steps(3)}
.label small{display:block;color:#c9c3ff;font-size:11px}
.label.on{opacity:1}
.bottom{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center}
#ph{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;display:none}
.cream{position:absolute;pointer-events:none;background:#f7e7c1;border:calc(var(--u)*0.8) solid #7a4a1e;box-shadow:inset 0 0 0 calc(var(--u)*0.6) #d2a06a,0 0 0 calc(var(--u)*0.6) #3b2010;color:#6b3a10;font-family:'Do Hyeon',sans-serif}
.cbar{height:calc(var(--u)*3);background:#5a3a22;border:calc(var(--u)*0.5) solid #3b2010;margin-top:2%}.cbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#e9b23c 0 calc(var(--u)*2),#ffe08a calc(var(--u)*2) calc(var(--u)*2.6));transition:width .15s steps(3)}
.tag2{font-family:'Press Start 2P',monospace;font-size:calc(var(--u)*2.4);align-self:center}
.abtn{pointer-events:auto;font-size:calc(var(--u)*5.4);padding:2.2% 4%;cursor:pointer;touch-action:none}.abtn b{display:inline-block;width:1.4em;height:1.4em;line-height:1.4em;border-radius:50%;background:#1f8a4c;color:#fff;font-weight:400;text-align:center;box-shadow:0 0 0 calc(var(--u)*0.5) #0f4a28;margin-right:.3em}
.abtn:active{transform:translateY(2px)}
.iff{font-family:'Press Start 2P',monospace;font-size:calc(var(--u)*6.4);color:#e2a12a;text-shadow:calc(var(--u)*0.5) calc(var(--u)*0.5) 0 #7a3d10;margin-bottom:2%}
.yaho{position:absolute;white-space:nowrap;background:#fff;border:calc(var(--u)*0.7) solid #2a160c;color:#c8302a;font-size:calc(var(--u)*6);padding:1% 3%;transform:translate(-50%,-50%) rotate(-6deg)}
.yaho:after{content:'';position:absolute;left:12%;bottom:calc(var(--u)*-2.6);border:calc(var(--u)*1.2) solid transparent;border-top-color:#2a160c;border-left-color:#2a160c}
.mvglow{position:absolute;left:50%;top:40%;width:58%;aspect-ratio:1;border-radius:50%;background:#f9edcf;transform:translate(-50%,-50%)}
.mvimg{position:relative;height:62%;image-rendering:pixelated}
.spk{position:absolute;color:#e9b23c;font-size:calc(var(--u)*5);animation:blink 1.2s steps(1) infinite}
.tipbar{position:absolute;left:4%;right:4%;bottom:2.5%;background:#2a1a10;color:#f7e7c1;font-size:calc(var(--u)*3.9);padding:1.6% 3%;white-space:nowrap;font-family:'Do Hyeon',sans-serif}.tipbar b{font-family:'Press Start 2P',monospace;color:#f2c14e;font-size:.7em;font-weight:400;margin-right:.6em}
.plate{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#1b1f3f;border:2px solid var(--gold2);padding:4px 10px;font-size:13px;color:var(--gold);white-space:nowrap;box-shadow:0 0 0 2px #000}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .4s steps(6)}
@keyframes blink{50%{opacity:0}}
.blink{animation:blink 1s steps(1) infinite}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span id="sceneName">金銅大香爐</span><span id="hudR"></span><button id="mute">♪ ON</button></div>
  <div id="stage"><canvas id="c"></canvas><canvas id="ph" width="720" height="1080"></canvas><div id="overlay"></div></div>
  <div id="panel">
    <div id="dlg" class="box"><span id="dlgText"></span></div>
    <div id="digProg" class="prog" style="display:none"><i id="digBar"></i></div>
    <div id="codex" style="display:none"></div>
  </div>
</div>
<script>
(()=>{
const W=160,H=240;
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return [c,g];};
const [buf,bx]=mk(W,H);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- palette & pixel helpers ---------- */
const PAL={K:'#2a1a0c',D:'#8a5a1c',G:'#d9a23a',Y:'#ffe08a',W:'#fff7dc',R:'#c8452f',B:'#4b6bd6',S:'#f0c090',T:'#2f8f7a'};
function P(g,x,y,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),1,1);}
function RR(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);}
function spr(g,rows,x,y,pal){pal=pal||PAL;for(let j=0;j<rows.length;j++){const r=rows[j];for(let i=0;i<r.length;i++){const ch=r[i];if(ch!=='.')P(g,x+i,y+j,pal[ch]);}}}
function disc(g,x,y,r,c){const n=Math.ceil(r);for(let j=-n;j<=n;j++)for(let i=-n;i<=n;i++)if(i*i+j*j<=r*r)P(g,x+i,y+j,c);}
function ring(g,x,y,r,c){const n=Math.ceil(2*Math.PI*r*1.6);for(let i=0;i<n;i++){const a=i/n*Math.PI*2;P(g,x+Math.cos(a)*r,y+Math.sin(a)*r,c);}}
function hash(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295;}

/* ---------- sprites ---------- */
const PHX=[
"........KK.........",
".......KYYK........",
"......KYKYYK.......",
"......KYYYYRK......",
".......KYYK....KK..",
"..KK...KGGK...KYYK.",
".KYYKK.KGGK..KYGGK.",
"KYGGGYKKGGKKYGGGK..",
"KGGDGGGYGGYGGGDGK..",
".KGDDGGGGGGGGDDK...",
"..KKDDGGGGGGDDKK...",
"....KKGGGGGGKK.....",
".....KGGDDGGK......",
"....KYGK..KGYK.....",
"...KYGK....KGYK....",
"....KK......KK....."];
const PETAL=["...D...","..DYD..",".DYYGD.",".DYGGD.","DYGGGGD","DYGGGGD",".DGGGD.","..DDD.."];
const DHEAD=["KK.......KK",".KK.....KK.","..KGGGGGK..",".KGYKGKYGK.","KGGGGGGGGGK",".KGRGGGRGK.","..KKKKKKK.."];
const MUS=["R","W","Y","T","R"].map(c=>[".S.","KDK","D"+c+"D","KDK","D.D"]);
const DEER=["K.K..",".K...","KKKK.",".K.K."],TIGER=["K....","KKKKK","KDKDK","K.K.K"],MONKEY=[".K.",".KK","KK.","K.K"],
      ELEPH=[".KKK.","KKKKK","K.KK.","K.K.."],BIRD=["K.K",".K."],HERMIT=[".S.","KDK",".D."];
const ANIMALS=[{s:DEER,x:-17,y:21},{s:MONKEY,x:12,y:14},{s:TIGER,x:5,y:30},{s:ELEPH,x:-11,y:38},{s:BIRD,x:-4,y:23},{s:HERMIT,x:17,y:38},{s:DEER,x:-22,y:44},{s:BIRD,x:20,y:24}];
const WALK=[["..KK..",".KSSK.","..SS..",".BBBB.","BBBBBB","S.BB.S","..BB..",".K..K.",".K..K."],
            ["..KK..",".KSSK.","..SS..",".BBBB.","BBBBBB","S.BB.S","..BB..","..KK..","..KK.."]];
const VIS=["..KK..",".KKKK.","..KK..",".KKKK.","KKKKKK","K.KK.K","..KK..","..KK..",".K..K.",".K..K."];

/* ---------- the incense burner (prerendered) ---------- */
function shade(x,hw){if(x===-hw||x===hw)return PAL.K;const s=(x+hw)/(2*hw);return s<0.15?PAL.G:s<0.4?PAL.Y:s<0.78?PAL.G:PAL.D;}
function drawBase(g,cx,y0){const h=7;for(let r=0;r<h;r++){const k=(r-3)/3.5;const hw=Math.round(22*Math.sqrt(Math.max(0,1-k*k)));for(let x=-hw;x<=hw;x++)P(g,cx+x,y0+r,(x===-hw||x===hw||r===h-1)?PAL.K:r<2?PAL.Y:PAL.D);}
  for(let x=-18;x<=16;x+=6){P(g,cx+x,y0+3,PAL.Y);P(g,cx+x+1,y0+2,PAL.Y);P(g,cx+x+2,y0+3,PAL.Y);}}
function drawDragon(g,cx,S){const pts=[];
  for(let i=0;i<=80;i++){const s=i/80,A=12*Math.pow(1-s,0.8);pts.push([cx+A*Math.sin(s*Math.PI*2.6+0.6),S+37-s*29]);}
  pts.forEach(p=>disc(g,p[0],p[1],3.4,PAL.K));
  pts.forEach(p=>disc(g,p[0],p[1],2.4,PAL.G));
  pts.forEach((p,i)=>{P(g,p[0]-1,p[1]-1,PAL.Y);if(i%6===0)P(g,p[0]+1,p[1],PAL.D);});
  [0.22,0.5,0.75].forEach((s,j)=>{const p=pts[Math.round(s*80)],d=j%2?1:-1;for(let k=1;k<=5;k++)P(g,p[0]+d*(2+k),p[1]+(k>3?1:0),PAL.K);for(let k=0;k<3;k++)P(g,p[0]+d*8,p[1]-1+k,PAL.Y);});
  spr(g,DHEAD,cx-5,S+1);}
function drawBowl(g,cx,B){const h=30,hwAt=r=>Math.round(28-16*Math.pow(clamp(r,0,h-1)/(h-1),1.8));
  for(let r=0;r<h;r++){const hw=hwAt(r);for(let x=-hw;x<=hw;x++)P(g,cx+x,B+r,r===h-1?PAL.K:shade(x,hw));}
  [[1,0],[10,4],[19,0]].forEach(([ty,off])=>{const hw=hwAt(ty+6);for(let px=-hw+3+off;px<=hw-3;px+=8)spr(g,PETAL,cx+px-3,B+ty);});}
function drawLid(g,cx,L){const h=52,hwAt=r=>Math.round(10+19*Math.sin(clamp(r/(h-1),0,1)*Math.PI/2));
  for(let r=0;r<h;r++){const hw=hwAt(r);for(let x=-hw;x<=hw;x++)P(g,cx+x,L+r,r===0?PAL.K:shade(x,hw));}
  for(let lv=0;lv<5;lv++){const y=L+9+lv*8,hw=hwAt(y-L+3),off=(lv%2)*3;
    for(let px=-hw+4+off;px<=hw-4;px+=7){for(let k=0;k<4;k++){P(g,cx+px-k,y+k,PAL.D);P(g,cx+px+k,y+k,PAL.D);}P(g,cx+px,y,PAL.W);}}
  for(let x=-29;x<=29;x++){P(g,cx+x,L+h-2,PAL.D);P(g,cx+x,L+h-1,PAL.K);}
  [-8,-4,0,4,8].forEach((dx,i)=>spr(g,MUS[i],cx+dx-1,L+2));
  ANIMALS.forEach(a=>spr(g,a.s,cx+a.x,L+a.y));}
function drawBurner(g,cx,T){drawBase(g,cx,T+134);drawDragon(g,cx,T+99);drawBowl(g,cx,T+70);drawLid(g,cx,T+18);
  disc(g,cx,T+17,2,PAL.Y);P(g,cx-1,T+16,PAL.W);spr(g,PHX,cx-9,T);}
const BW=64,BH=144,BCX=32;
const [burnerCv,burnerG]=mk(BW,BH);drawBurner(burnerG,BCX,1);
const bData=burnerG.getImageData(0,0,BW,BH).data;
const bOpaque=(x,y)=>x>=0&&y>=0&&x<BW&&y<BH&&bData[(y*BW+x)*4+3]>0;
const drawBurnerAt=(g,cx,T)=>{if(IMG.burner_small)g.drawImage(IMG.burner_small,cx-23,T);};

/* ---------- audio ---------- */
let AC=null,muted=false;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function beep(f,d,type,v,slide){if(!AC||muted)return;d=d||0.08;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(f+slide,t+d);g.gain.setValueAtTime(v||0.04,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02);}
const jingle=(ns,gap)=>ns.forEach((n,i)=>setTimeout(()=>beep(n,0.14,'square',0.05),i*(gap||110)));
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'♪ OFF':'♪ ON';};

/* ---------- UI ---------- */
const overlay=$('#overlay');
let dlgTimer;
function say(t){clearInterval(dlgTimer);const el=$('#dlgText');el.textContent='';let i=0;
  dlgTimer=setInterval(()=>{el.textContent=t.slice(0,++i);if(i%3===0)beep(900,0.02,'square',0.012);if(i>=t.length)clearInterval(dlgTimer);},26);}
function layout(){const availH=innerHeight-32-158-14;const w=Math.max(200,Math.min(innerWidth-14,480,Math.floor(availH*2/3)));
  $('#stage').style.width=w+'px';$('#stage').style.height=Math.round(w*1.5)+'px';$('#hud').style.width=w+'px';$('#panel').style.width=w+'px';$('#stage').style.setProperty('--u',(w/100)+'px');}
addEventListener('resize',layout);layout();

/* ---------- data ---------- */
const ENTRIES=[
 {id:'phoenix',name:'봉황',en:'PHOENIX',dy:9,r:9,sub:'하늘 세계',
  how:'꼭대기에서 반짝이는 깃털을 따라가 발견',
  desc:'뚜껑 꼭대기에서 날개를 펴고 선 상서로운 새. 턱 아래 여의주를 끼고 있으며 하늘 세계를 상징한다.'},
 {id:'musicians',name:'다섯 악사',en:'MUSICIANS',dy:24,r:6,sub:'음악이 흐르는 낙원',
  how:'봉황 발밑에서 들려오는 소리를 추적',
  desc:'뚜껑 윗부분 봉우리 사이에 다섯 악사가 둘러앉아 완함·종적·배소·거문고·북을 연주한다. 백제 음악을 보여 주는 귀한 자료.'},
 {id:'mountain',name:'산과 동물',en:'MOUNTAINS',dy:40,r:11,sub:'신선의 세계',
  how:'겹겹의 봉우리를 하나씩 비춰 숨은 동물을 찾음',
  desc:'첩첩이 솟은 산봉우리 사이로 호랑이·사슴·코끼리·원숭이 같은 동물과 신선 같은 인물이 숨어 있다. 신선이 사는 이상 세계를 담았다.'},
 {id:'lotus',name:'연꽃',en:'LOTUS',dy:61,r:11,sub:'물과 생명',
  how:'몸체의 꽃잎 무늬를 겹겹이 세어 봄',
  desc:'몸체는 활짝 핀 연꽃 모양. 꽃잎 사이사이에 물고기·새 같은 생물이 새겨져 물과 생명의 세계를 이룬다.'},
 {id:'dragon',name:'용',en:'DRAGON',dy:96,r:16,sub:'물의 근원 · 받침',
  how:'받침을 감은 비늘을 따라 내려가 머리를 찾음',
  desc:'받침이 된 용이 몸을 힘차게 틀어 올리고, 입으로 연꽃 몸체를 받쳐 물고 있다. 꼭대기의 봉황과 짝을 이룬다.'}
];
const codex=$('#codex');
ENTRIES.forEach(e=>{const d=document.createElement('div');d.className='slot';d.innerHTML='?';e.slot=d;codex.appendChild(d);});

/* ---------- state ---------- */
let scene='title',st=0,fade=0,flash=0,now=0;
const ptr={down:false,last:null};
let cursor=null,lastScrape=0;
const parts=[];
const stars=Array.from({length:46},(_,i)=>({x:Math.floor(hash(i,7)*W),y:Math.floor(hash(i,9)*86),p:hash(i,3)*6,sp:1+hash(i,5)*3,b:hash(i,11)>0.7}));
function drawStars(g,t,maxY){stars.forEach(s=>{if(s.y<maxY&&Math.sin(t*s.sp+s.p)>-0.4)P(g,s.x,s.y,s.b?'#fff7dc':'#7d84c8');});}
function go(s){scene=s;st=0;fade=1;}

/* ---------- backgrounds ---------- */
const PIT={x:30,y:92,w:100,h:148},DIG={cx:80,T:98};
const [digBg,dg]=mk(W,H);
(()=>{const sky=['#060a22','#091030','#0c143c','#111a4a','#16205a'];for(let i=0;i<5;i++)RR(dg,0,i*16,W,16,sky[i]);
 disc(dg,130,20,7,'#f6e7b0');disc(dg,128,18,2,'#e2cf90');P(dg,133,23,'#e2cf90');
 for(let x=0;x<W;x++){const h=7+Math.round(4*Math.sin(x*0.07)+3*Math.sin(x*0.19+1));RR(dg,x,80-h,1,h,'#0a0f30');}

/* ---------- TITLE ---------- */
function showTitle(){scene='title';st=0;$('#sceneName').textContent='金銅大香爐';$('#hudR').textContent='';$('#codex').style.display='none';$('#digProg').style.display='none';
  overlay.innerHTML='<div class="center" style="justify-content:space-between;padding:12% 0 10%"><div><div class="banner" style="font-size:15px">향로 발굴 기록</div><div class="tag" style="margin-top:10px">BAEKJE GILT-BRONZE INCENSE BURNER</div></div><div><button class="btn" id="start">PRESS START</button></div></div>';
  say('백제금동대향로를 발굴하고, 분석하고, 도감을 완성하자. 16비트 조사 일지 시작!');
  $('#start').onclick=async()=>{audio();await imgsReady;jingle([392,523,659,784],90);overlay.innerHTML='';startDig();};}
function drawTitle(){const sky=['#060a22','#08102e','#0b1438','#0e1844','#121d52','#16205a'];for(let i=0;i<6;i++)RR(ctx,0,i*40,W,40,sky[i]);drawStars(ctx,now/1000,240);
  const gr=ctx.createRadialGradient(80,135,5,80,135,80);gr.addColorStop(0,'rgba(242,193,78,.28)');gr.addColorStop(1,'rgba(242,193,78,0)');ctx.fillStyle=gr;ctx.fillRect(0,40,W,200);
  drawBurnerAt(ctx,80,70+Math.round(Math.sin(now/600)*2));
  for(let i=0;i<5;i++){const a=now/700+i*1.26;sparkle(ctx,80+Math.cos(a)*44,130+Math.sin(a)*70,(now/150+i)%2<1);}}

function restart(){ph.style.display='none';found={};paused=false;idle=0;hints=[];ENTRIES.forEach(e=>{e.slot.className='slot';e.slot.innerHTML='?';e.img=null;});overlay.innerHTML='';audio();startDig();}

/* ---------- input ---------- */
function toL(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function onPtr(e){const p=toL(e);
  if(scene==='dig'){if(!ptr.down||digDone)return;if(ptr.last){rubAcc+=Math.hypot(p.x-ptr.last.x,p.y-ptr.last.y);while(rubAcc>22){rubAcc-=22;stroke();}}else{stroke();}ptr.last=p;return;}
  else if(scene==='lab'){lens.vis=true;const off=e.pointerType==='mouse'?0:-26;lens.x=clamp(Math.round(p.x),8,152);lens.y=clamp(Math.round(p.y+off),8,232);}}
cv.addEventListener('pointerdown',e=>{audio();try{cv.setPointerCapture(e.pointerId);}catch(_){}ptr.down=true;ptr.last=null;onPtr(e);});
cv.addEventListener('pointermove',onPtr);
addEventListener('pointerup',()=>{ptr.down=false;ptr.last=null;});
addEventListener('pointercancel',()=>{ptr.down=false;ptr.last=null;});

/* ---------- loop ---------- */
let last=performance.now();
function loop(t){const dt=Math.min(0.05,(t-last)/1000);last=t;now=t;st+=dt;
  if(scene==='lab')updateLab(dt);
  parts.forEach(p=>{p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;});for(let i=parts.length-1;i>=0;i--)if(parts[i].life<=0)parts.splice(i,1);
  if(scene==='title')drawTitle();else if(scene==='dig')drawDig(dt);else if(scene==='move')drawMove();else if(scene==='lab')drawLab();else if(scene==='diagram')drawDiagram();else if(scene==='museum')drawMuseum(dt);
  parts.forEach(p=>P(ctx,p.x,p.y,p.c));
  if(flash>0){ctx.fillStyle='rgba(255,247,220,'+flash+')';ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-dt*2.5);}
  if(fade>0){ctx.fillStyle='rgba(0,0,0,'+fade+')';ctx.fillRect(0,0,W,H);fade=Math.max(0,fade-dt*2.2);}
  requestAnimationFrame(loop);}
showTitle();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
